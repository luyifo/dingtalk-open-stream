<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2430" viewBox="0 0 1800 2430" role="img" aria-labelledby="title desc">
  <title id="title">StreamClient lifecycle</title>
  <desc id="desc">The flow proceeds from top to bottom. Parallel events are arranged from left to right, and retry paths return to the registration request.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; fill: #17324d; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .join { fill: none; stroke: #64748b; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #eaf4fc; stroke: #8eb5d1; stroke-width: 1.8; }
      .decision { fill: #f7fbff; stroke: #8eb5d1; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .terminal { fill: #ffffff; stroke: #5c87a5; stroke-width: 2; }
      .node-text { font-size: 16px; font-weight: 600; }
      .small { font-size: 13px; font-weight: 500; }
      .label { font-size: 14px; font-weight: 600; }
      .pill { fill: #ffffff; stroke: #cbd8e3; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1800" height="2430" fill="#ffffff" />

  <g aria-hidden="true">
    <path class="edge" d="M900 86 V115" />
    <path class="edge" d="M900 183 V225" />
    <path class="edge" d="M900 293 V335" />
    <path class="edge" d="M900 411 V455" />
    <path class="edge" d="M900 533 V590" />
    <path class="edge" d="M1130 494 H1150" />
    <path class="join" d="M1600 495 H1760" />

    <path class="join" d="M760 650 H120" />
    <path class="edge" d="M1040 650 H1230 V780" />
    <path class="edge" d="M1230 852 V885" />
    <path class="join" d="M1100 940 H120" />
    <path class="edge" d="M1230 995 V1160" />
    <path class="edge" d="M1420 816 H1500 V1030" />
    <path class="join" d="M1640 1075 H1760" />

    <path class="edge" d="M1230 1232 V1270" />
    <path class="join" d="M1230 1390 V1450 H300" />
    <path class="join" d="M1230 1450 H1330" />
    <path class="edge" d="M300 1450 V1510" />
    <path class="edge" d="M650 1450 V1510" />
    <path class="edge" d="M1000 1450 V1510" />
    <path class="edge" d="M1330 1450 V1510" />

    <path class="join" d="M1000 1620 V1660 H120" />
    <path class="join" d="M120 650 V1700" />
    <path class="edge" d="M120 1745 H300" />
    <path class="edge" d="M510 1790 V1850" />
    <path class="join" d="M670 1910 H1760 V2140" />
    <path class="edge" d="M510 1970 V2010 H55 V494 H670" />

    <path class="edge" d="M1330 1620 V1690" />
    <path class="join" d="M1480 1750 H1760 V2140" />
    <path class="edge" d="M1180 1750 H900 V1840" />
    <path class="join" d="M900 1920 V2140" />

    <path class="join" d="M1760 495 V2140" />
    <path class="join" d="M300 2140 H1760" />
    <path class="edge" d="M900 2140 V2180" />
    <path class="edge" d="M900 2270 V2322" />
  </g>

  <g class="labels">
    <rect class="pill" x="914" y="548" width="152" height="26" rx="13" />
    <text class="small" x="990" y="566" text-anchor="middle">HTTP response received</text>
    <rect class="pill" x="565" y="624" width="92" height="26" rx="13" />
    <text class="label" x="611" y="642" text-anchor="middle">Failed</text>
    <rect class="pill" x="1050" y="624" width="92" height="26" rx="13" />
    <text class="label" x="1096" y="642" text-anchor="middle">Succeeded</text>
    <rect class="pill" x="1018" y="912" width="92" height="26" rx="13" />
    <text class="label" x="1064" y="930" text-anchor="middle">Failed</text>
    <rect class="pill" x="1242" y="1005" width="92" height="26" rx="13" />
    <text class="label" x="1288" y="1023" text-anchor="middle">Succeeded</text>

    <rect class="pill" x="246" y="1410" width="108" height="26" rx="13" />
    <text class="small" x="300" y="1428" text-anchor="middle">SYSTEM ping</text>
    <rect class="pill" x="595" y="1410" width="110" height="26" rx="13" />
    <text class="small" x="650" y="1428" text-anchor="middle">Business message</text>
    <rect class="pill" x="899" y="1410" width="202" height="26" rx="13" />
    <text class="small" x="1000" y="1428" text-anchor="middle">disconnect / connection lost</text>
    <rect class="pill" x="1270" y="1410" width="120" height="26" rx="13" />
    <text class="small" x="1330" y="1428" text-anchor="middle">stop() / close()</text>

    <rect class="pill" x="1478" y="1722" width="52" height="26" rx="13" />
    <text class="label" x="1504" y="1740" text-anchor="middle">Yes</text>
    <rect class="pill" x="1080" y="1722" width="52" height="26" rx="13" />
    <text class="label" x="1106" y="1740" text-anchor="middle">No</text>
    <rect class="pill" x="728" y="1880" width="52" height="26" rx="13" />
    <text class="label" x="754" y="1898" text-anchor="middle">Yes</text>
    <rect class="pill" x="240" y="1980" width="262" height="26" rx="13" />
    <text class="small" x="371" y="1998" text-anchor="middle">No: retry with a fresh ticket</text>
  </g>

  <g class="nodes" text-anchor="middle">
    <circle class="terminal" cx="900" cy="50" r="36" />
    <text class="node-text" x="900" y="56">Start</text>

    <rect class="node" x="680" y="115" width="440" height="68" rx="14" />
    <text class="node-text" x="900" y="156">Create StreamClient</text>

    <rect class="node" x="680" y="225" width="440" height="68" rx="14" />
    <text class="node-text" x="900" y="266">Register message handlers</text>

    <rect class="node" x="620" y="335" width="560" height="76" rx="14" />
    <text class="node-text" x="900" y="366">
      <tspan x="900">Start the client in the background with start()</tspan>
    </text>

    <rect class="node" x="670" y="455" width="460" height="78" rx="14" />
    <text class="node-text" x="900" y="501">Register connection and request ticket</text>

    <rect class="node" x="1150" y="450" width="450" height="90" rx="14" />
    <text class="node-text" x="1375" y="482">
      <tspan x="1375">Cancel registration request</tspan>
      <tspan class="small" x="1375" dy="22">stop/close before HTTP registration completes</tspan>
    </text>

    <polygon class="decision" points="900,590 1040,650 900,710 760,650" />
    <text class="node-text" x="900" y="656">Registration succeeded?</text>

    <rect class="node" x="1040" y="780" width="380" height="72" rx="14" />
    <text class="node-text" x="1230" y="823">Open WebSocket</text>

    <polygon class="decision" points="1230,885 1360,940 1230,995 1100,940" />
    <text class="node-text" x="1230" y="946">Handshake succeeded?</text>

    <rect class="node" x="1360" y="1030" width="280" height="90" rx="14" />
    <text class="node-text" x="1500" y="1064">
      <tspan x="1500">Cancel WebSocket handshake</tspan>
      <tspan class="small" x="1500" dy="22">stop/close before handshake completes</tspan>
    </text>

    <rect class="node" x="1010" y="1160" width="440" height="72" rx="14" />
    <text class="node-text" x="1230" y="1203">Receive and dispatch messages</text>

    <polygon class="decision" points="1230,1270 1380,1330 1230,1390 1080,1330" />
    <text class="node-text" x="1230" y="1336">What happens at runtime?</text>

    <rect class="node" x="150" y="1510" width="300" height="110" rx="14" />
    <text class="node-text" x="300" y="1550">
      <tspan x="300">Reply to ping in the reader</tspan>
      <tspan x="300" dy="24">Send System ACK, then continue</tspan>
    </text>

    <rect class="node" x="485" y="1510" width="330" height="110" rx="14" />
    <text class="node-text" x="650" y="1550">
      <tspan x="650">Run the business handler concurrently</tspan>
      <tspan x="650" dy="24">Send protocol ACK when it completes</tspan>
    </text>

    <rect class="node" x="835" y="1510" width="330" height="110" rx="14" />
    <text class="node-text" x="1000" y="1550">
      <tspan x="1000">Cancel handlers from the old connection</tspan>
      <tspan x="1000" dy="24">Enter the shared reconnect backoff</tspan>
    </text>

    <rect class="node" x="1180" y="1510" width="300" height="110" rx="14" />
    <text class="node-text" x="1330" y="1550">
      <tspan x="1330">Stop receiving new messages</tspan>
      <tspan x="1330" dy="24">Wait for in-flight handlers</tspan>
    </text>

    <rect class="node" x="300" y="1700" width="420" height="90" rx="14" />
    <text class="node-text" x="510" y="1737">
      <tspan x="510">Shared exponential backoff</tspan>
      <tspan class="small" x="510" dy="23">Registration, handshake, or connection failure</tspan>
    </text>

    <polygon class="decision" points="510,1850 670,1910 510,1970 350,1910" />
    <text class="node-text" x="510" y="1905">
      <tspan x="510">Was stop/close requested</tspan>
      <tspan x="510" dy="22">during backoff?</tspan>
    </text>

    <polygon class="decision" points="1330,1690 1480,1750 1330,1810 1180,1750" />
    <text class="node-text" x="1330" y="1735">
      <tspan x="1330">Do handlers finish within</tspan>
      <tspan x="1330" dy="22">shutdown_timeout</tspan>
      <tspan x="1330" dy="22">(30 s by default)?</tspan>
    </text>

    <rect class="node" x="730" y="1840" width="340" height="80" rx="14" />
    <text class="node-text" x="900" y="1888">Cancel unfinished handlers</text>

    <rect class="node" x="650" y="2180" width="500" height="90" rx="14" />
    <text class="node-text" x="900" y="2217">
      <tspan x="900">Close WebSocket if open</tspan>
      <tspan x="900" dy="24">Close the SDK-owned HTTP client</tspan>
    </text>

    <circle class="terminal" cx="900" cy="2360" r="38" />
    <text class="node-text" x="900" y="2366">End</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="3090" viewBox="0 0 2000 3090" role="img" aria-labelledby="title desc">
  <title id="title">StreamClient lifecycle</title>
  <desc id="desc">Registration, connection and continuous message reception. SDK dispatch tasks handle business messages concurrently; application background tasks are independently managed. Every stop path drains SDK dispatch tasks, requests cancellation on timeout, then releases client resources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569" /></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17324d; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .join { fill: none; stroke: #475569; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #eaf4fc; stroke: #8eb5d1; stroke-width: 1.8; }
      .decision { fill: #f7fbff; stroke: #8eb5d1; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .terminal { fill: white; stroke: #5c87a5; stroke-width: 2; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .node-text { font-size: 21px; font-weight: 600; }
      .small { font-size: 18px; font-weight: 500; }
      .label { font-size: 20px; font-weight: 600; }
    </style>
  </defs>
  <rect width="2000" height="3090" fill="white" />
  <!-- Line jumps show crossings without a flow junction. -->
  <g aria-hidden="true">
    <path class="edge" d="M1000 95 V135" />
    <path class="edge" d="M1000 215 V245" />
    <path class="edge" d="M1000 325 V355" />
    <path class="edge" d="M1000 435 V505" />
    <path class="edge" d="M1000 595 V645" />
    <path class="edge" d="M1250 550 H1350" />
    <path class="edge" d="M800 710 H120 V1900 H220" />
    <path class="edge" d="M1000 775 V825" />
    <path class="edge" d="M1000 915 V965" />
    <path class="edge" d="M1230 870 H1300 V950 H1350" />
    <path class="edge" d="M800 1030 H120" />
    <path class="edge" d="M1000 1095 V1145" />
    <path class="edge" d="M1000 1235 V1270" />
    <path class="edge" d="M1850 550 H1930 V2300 H1750" />
    <path class="join" d="M1850 950 H1930" />
    <path class="join" d="M1000 1410 V1460 H340" />
    <path class="join" d="M1000 1460 H1680" />
    <path class="edge" d="M340 1460 V1510" />
    <path class="edge" d="M790 1460 V1510" />
    <path class="edge" d="M1230 1460 V1510" />
    <path class="edge" d="M1680 1460 V1510" />
    <path class="join" d="M340 1670 V1760 H132 Q120 1742 108 1760 H80" />
    <path class="edge" d="M790 1670 V1800 H132 Q120 1782 108 1800 H80 V1190 H108 Q120 1172 132 1190 H775" />
    <path class="join" d="M1230 1670 V1840 H120" />
    <path class="join" d="M1885 1590 H1930" />
    <path class="edge" d="M500 1950 V2010" />
    <path class="join" d="M700 2080 H1930" />
    <path class="edge" d="M500 2150 V2200 H40 V550 H750" />
    <path class="edge" d="M1450 2360 V2400" />
    <path class="edge" d="M1720 2490 H1880 V2840 H1750" />
    <path class="edge" d="M1450 2580 V2595 H1000 V2630" />
    <path class="edge" d="M1000 2730 V2840 H1150" />
    <path class="edge" d="M1450 2900 V2965" />
  </g>
  <g><rect x="675" y="671" width="90" height="30" rx="12" fill="white" /><text class="label" x="720" y="693" text-anchor="middle">Failed</text></g>
  <g><rect x="1023.5" y="785" width="123" height="30" rx="12" fill="white" /><text class="label" x="1085" y="807" text-anchor="middle">Succeeded</text></g>
  <g><rect x="675" y="991" width="90" height="30" rx="12" fill="white" /><text class="label" x="720" y="1013" text-anchor="middle">Failed</text></g>
  <g><rect x="1023.5" y="1106" width="123" height="30" rx="12" fill="white" /><text class="label" x="1085" y="1128" text-anchor="middle">Succeeded</text></g>
  <g><rect x="267.5" y="1418" width="145" height="30" rx="12" fill="white" /><text class="label" x="340" y="1440" text-anchor="middle">SYSTEM ping</text></g>
  <g><rect x="690" y="1418" width="200" height="30" rx="12" fill="white" /><text class="label" x="790" y="1440" text-anchor="middle">Business message</text></g>
  <g><rect x="1064" y="1418" width="332" height="30" rx="12" fill="white" /><text class="label" x="1230" y="1440" text-anchor="middle">disconnect / connection lost</text></g>
  <g><rect x="1580" y="1418" width="200" height="30" rx="12" fill="white" /><text class="label" x="1680" y="1440" text-anchor="middle">stop() / close()</text></g>
  <g><rect x="314" y="1718" width="222" height="30" rx="12" fill="white" /><text class="label" x="425" y="1740" text-anchor="middle">Continue receiving</text></g>
  <g><rect x="509" y="1758" width="222" height="30" rx="12" fill="white" /><text class="label" x="620" y="1780" text-anchor="middle">Continue receiving</text></g>
  <g><rect x="736.5" y="2043" width="57" height="30" rx="12" fill="white" /><text class="label" x="765" y="2065" text-anchor="middle">Yes</text></g>
  <g><rect x="228" y="2160" width="464" height="30" rx="12" fill="white" /><text class="label" x="460" y="2182" text-anchor="middle">No: backoff ends; request a fresh ticket</text></g>
  <g><rect x="1711.5" y="2448" width="57" height="30" rx="12" fill="white" /><text class="label" x="1740" y="2470" text-anchor="middle">Yes</text></g>
  <g><rect x="1487" y="2578" width="46" height="30" rx="12" fill="white" /><text class="label" x="1510" y="2600" text-anchor="middle">No</text></g>
  <g id="start" text-anchor="middle">
    <rect class="terminal" x="920" y="35" width="160" height="60" rx="30" />
    <text class="node-text" x="1000" y="73">Start</text>
  </g>
  <g id="create" text-anchor="middle">
    <rect class="node" x="750" y="135" width="500" height="80" rx="16" />
    <text class="node-text" x="1000" y="183">Create StreamClient</text>
  </g>
  <g id="handlers" text-anchor="middle">
    <rect class="node" x="750" y="245" width="500" height="80" rx="16" />
    <text class="node-text" x="1000" y="293">Register message handlers</text>
  </g>
  <g id="launch" text-anchor="middle">
    <rect class="node" x="650" y="355" width="700" height="80" rx="16" />
    <text class="node-text" x="1000" y="403">Start the client in the background with start()</text>
  </g>
  <g id="register" text-anchor="middle">
    <rect class="node" x="750" y="505" width="500" height="90" rx="16" />
    <text class="node-text" x="1000" y="558">Register and request a fresh ticket</text>
  </g>
  <g id="cancel-register" text-anchor="middle">
    <rect class="node" x="1350" y="500" width="500" height="100" rx="16" />
    <text class="node-text" x="1600" y="542.5">Cancel pending registration</text>
    <text class="small" x="1600" y="573.5">stop() / close() during registration</text>
  </g>
  <g id="registered" text-anchor="middle">
    <polygon class="decision" points="1000,645 1200,710 1000,775 800,710" />
    <text class="node-text" x="1000" y="718">Registration succeeded?</text>
  </g>
  <g id="connect" text-anchor="middle">
    <rect class="node" x="770" y="825" width="460" height="90" rx="16" />
    <text class="node-text" x="1000" y="878">Open WebSocket</text>
  </g>
  <g id="cancel-connect" text-anchor="middle">
    <rect class="node" x="1350" y="887.5" width="500" height="125" rx="16" />
    <text class="node-text" x="1600" y="927">Cancel pending handshake</text>
    <text class="small" x="1600" y="958">stop() / close() during handshake</text>
    <text class="small" x="1600" y="989">Close the connection if already established</text>
  </g>
  <g id="connected" text-anchor="middle">
    <polygon class="decision" points="1000,965 1200,1030 1000,1095 800,1030" />
    <text class="node-text" x="1000" y="1038">Handshake succeeded?</text>
  </g>
  <g id="receive" text-anchor="middle">
    <rect class="node" x="775" y="1145" width="450" height="90" rx="16" />
    <text class="node-text" x="1000" y="1198">Receive messages (reader loop)</text>
  </g>
  <g id="runtime" text-anchor="middle">
    <polygon class="decision" points="1000,1270 1250,1340 1000,1410 750,1340" />
    <text class="node-text" x="1000" y="1348">What happens at runtime?</text>
  </g>
  <g id="ping" text-anchor="middle">
    <rect class="node" x="135" y="1510" width="410" height="160" rx="16" />
    <text class="node-text" x="340" y="1582.5">Reply to ping in the reader</text>
    <text class="node-text" x="340" y="1613.5">Echo opaque data</text>
  </g>
  <g id="business" text-anchor="middle">
    <rect class="node" x="565" y="1510" width="450" height="160" rx="16" />
    <text class="node-text" x="790" y="1551.5">Create and track an SDK dispatch task</text>
    <text class="node-text" x="790" y="1582.5">Reader continues receiving</text>
    <text class="small" x="790" y="1613.5">Task calls / awaits the handler</text>
    <text class="small" x="790" y="1644.5">Returned Ack: try sending on its original socket</text>
  </g>
  <g id="disconnect" text-anchor="middle">
    <rect class="node" x="1025" y="1510" width="410" height="160" rx="16" />
    <text class="node-text" x="1230" y="1582.5">Keep in-flight SDK dispatch tasks</text>
    <text class="node-text" x="1230" y="1613.5">Close old socket; reconnect</text>
  </g>
  <g id="stop" text-anchor="middle">
    <rect class="node" x="1475" y="1510" width="410" height="160" rx="16" />
    <text class="node-text" x="1680" y="1582.5">Stop receiving new messages</text>
    <text class="node-text" x="1680" y="1613.5">Enter shared cleanup</text>
  </g>
  <g id="backoff" text-anchor="middle">
    <rect class="node" x="220" y="1850" width="560" height="100" rx="16" />
    <text class="node-text" x="500" y="1892.5">Shared exponential backoff with jitter</text>
    <text class="small" x="500" y="1923.5">Registration, handshake, or connection failure</text>
  </g>
  <g id="backoff-stop" text-anchor="middle">
    <polygon class="decision" points="500,2010 700,2080 500,2150 300,2080" />
    <text class="small" x="500" y="2072.5">Stop requested</text>
    <text class="small" x="500" y="2103.5">during backoff?</text>
  </g>
  <g id="cleanup" text-anchor="middle">
    <rect class="node" x="1150" y="2240" width="600" height="120" rx="16" />
    <text class="node-text" x="1450" y="2277">Shared cleanup: stop receiving new messages</text>
    <text class="small" x="1450" y="2308">Drain all in-flight SDK dispatch tasks, including ACK sends</text>
    <text class="small" x="1450" y="2339">Includes tasks left over from previous connections</text>
  </g>
  <g id="drained" text-anchor="middle">
    <polygon class="decision" points="1450,2400 1720,2490 1450,2580 1180,2490" />
    <text class="small" x="1450" y="2467">Do SDK dispatch tasks finish</text>
    <text class="small" x="1450" y="2498">within shutdown_timeout?</text>
    <text class="small" x="1450" y="2529">(default: 30 s)</text>
  </g>
  <g id="cancel" text-anchor="middle">
    <rect class="node" x="750" y="2630" width="500" height="100" rx="16" />
    <text class="node-text" x="1000" y="2657">Request cancellation of remaining tasks</text>
    <text class="small" x="1000" y="2688">Wait briefly for cooperative cancellation</text>
    <text class="small" x="1000" y="2719">Log tasks still pending; continue cleanup</text>
  </g>
  <g id="resources" text-anchor="middle">
    <rect class="node" x="1150" y="2780" width="600" height="120" rx="16" />
    <text class="node-text" x="1450" y="2832.5">Close WebSocket if still present</text>
    <text class="node-text" x="1450" y="2863.5">Close the SDK-owned HTTP client</text>
  </g>
  <g id="end" text-anchor="middle">
    <rect class="terminal" x="1240" y="2965" width="420" height="70" rx="35" />
    <text class="node-text" x="1450" y="3008">Client shutdown complete</text>
  </g>
  <g id="ownership" text-anchor="middle">
    <rect class="note" x="150" y="2345" width="700" height="250" rx="16" />
    <text class="node-text" x="500" y="2385">Application background work: separate lifecycle</text>
    <text class="small" x="500" y="2416">Tasks created by handlers are outside the SDK task set.</text>
    <text class="small" x="500" y="2447">The application manages their waiting and cancellation.</text>
    <text class="small" x="500" y="2478">The example exits TaskGroup after client.close().</text>
    <text class="small" x="500" y="2509">On normal exit, TaskGroup waits for its business tasks.</text>
    <text class="small" x="500" y="2540">Business resources should be released after those tasks finish.</text>
    <text class="small" x="500" y="2571">An exceptional / cancelled TaskGroup exit cancels tasks.</text>
  </g>
  <text class="small" x="1450" y="3070" text-anchor="middle">shutdown_timeout limits draining only; cancellation and resource cleanup take additional time.</text>
</svg>

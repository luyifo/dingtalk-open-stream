<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="3090" viewBox="0 0 2000 3090" role="img" aria-labelledby="title desc">
  <title id="title">StreamClient 生命周期图</title>
  <desc id="desc">客户端注册、连接和持续接收消息。业务消息由 SDK 分发任务并发处理；应用自建后台任务独立管理。所有停止路径统一等待在途 SDK 分发任务，超时请求取消，再释放客户端资源。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569" /></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17324d; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .join { fill: none; stroke: #475569; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #eaf4fc; stroke: #8eb5d1; stroke-width: 1.8; }
      .decision { fill: #f7fbff; stroke: #8eb5d1; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .terminal { fill: white; stroke: #5c87a5; stroke-width: 2; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .node-text { font-size: 23px; font-weight: 600; }
      .small { font-size: 20px; font-weight: 500; }
      .label { font-size: 20px; font-weight: 600; }
    </style>
  </defs>
  <rect width="2000" height="3090" fill="white" />
  <!-- Line jumps show crossings without a flow junction. -->
  <g aria-hidden="true">
    <path class="edge" d="M1000 95 V135" />
    <path class="edge" d="M1000 215 V245" />
    <path class="edge" d="M1000 325 V355" />
    <path class="edge" d="M1000 435 V505" />
    <path class="edge" d="M1000 595 V645" />
    <path class="edge" d="M1250 550 H1350" />
    <path class="edge" d="M800 710 H120 V1900 H220" />
    <path class="edge" d="M1000 775 V825" />
    <path class="edge" d="M1000 915 V965" />
    <path class="edge" d="M1230 870 H1300 V950 H1350" />
    <path class="edge" d="M800 1030 H120" />
    <path class="edge" d="M1000 1095 V1145" />
    <path class="edge" d="M1000 1235 V1270" />
    <path class="edge" d="M1850 550 H1930 V2300 H1750" />
    <path class="join" d="M1850 950 H1930" />
    <path class="join" d="M1000 1410 V1460 H340" />
    <path class="join" d="M1000 1460 H1680" />
    <path class="edge" d="M340 1460 V1510" />
    <path class="edge" d="M790 1460 V1510" />
    <path class="edge" d="M1230 1460 V1510" />
    <path class="edge" d="M1680 1460 V1510" />
    <path class="join" d="M340 1670 V1760 H132 Q120 1742 108 1760 H80" />
    <path class="edge" d="M790 1670 V1800 H132 Q120 1782 108 1800 H80 V1190 H108 Q120 1172 132 1190 H775" />
    <path class="join" d="M1230 1670 V1840 H120" />
    <path class="join" d="M1885 1590 H1930" />
    <path class="edge" d="M500 1950 V2010" />
    <path class="join" d="M700 2080 H1930" />
    <path class="edge" d="M500 2150 V2200 H40 V550 H750" />
    <path class="edge" d="M1450 2360 V2400" />
    <path class="edge" d="M1720 2490 H1880 V2840 H1750" />
    <path class="edge" d="M1450 2580 V2595 H1000 V2630" />
    <path class="edge" d="M1000 2730 V2840 H1150" />
    <path class="edge" d="M1450 2900 V2965" />
  </g>
  <g><rect x="689" y="671" width="62" height="30" rx="12" fill="white" /><text class="label" x="720" y="693" text-anchor="middle">失败</text></g>
  <g><rect x="1054" y="785" width="62" height="30" rx="12" fill="white" /><text class="label" x="1085" y="807" text-anchor="middle">成功</text></g>
  <g><rect x="689" y="991" width="62" height="30" rx="12" fill="white" /><text class="label" x="720" y="1013" text-anchor="middle">失败</text></g>
  <g><rect x="1054" y="1106" width="62" height="30" rx="12" fill="white" /><text class="label" x="1085" y="1128" text-anchor="middle">成功</text></g>
  <g><rect x="223.5" y="1418" width="233" height="30" rx="12" fill="white" /><text class="label" x="340" y="1440" text-anchor="middle">SYSTEM ping</text></g>
  <g><rect x="740" y="1418" width="100" height="30" rx="12" fill="white" /><text class="label" x="790" y="1440" text-anchor="middle">业务消息</text></g>
  <g><rect x="1056.5" y="1418" width="347" height="30" rx="12" fill="white" /><text class="label" x="1230" y="1440" text-anchor="middle">disconnect / 连接中断</text></g>
  <g><rect x="1516" y="1418" width="328" height="30" rx="12" fill="white" /><text class="label" x="1680" y="1440" text-anchor="middle">stop() / close()</text></g>
  <g><rect x="375" y="1718" width="100" height="30" rx="12" fill="white" /><text class="label" x="425" y="1740" text-anchor="middle">继续接收</text></g>
  <g><rect x="570" y="1758" width="100" height="30" rx="12" fill="white" /><text class="label" x="620" y="1780" text-anchor="middle">继续接收</text></g>
  <g><rect x="743.5" y="2043" width="43" height="30" rx="12" fill="white" /><text class="label" x="765" y="2065" text-anchor="middle">是</text></g>
  <g><rect x="277" y="2160" width="366" height="30" rx="12" fill="white" /><text class="label" x="460" y="2182" text-anchor="middle">否：退避结束，重新申请 ticket</text></g>
  <g><rect x="1718.5" y="2448" width="43" height="30" rx="12" fill="white" /><text class="label" x="1740" y="2470" text-anchor="middle">是</text></g>
  <g><rect x="1488.5" y="2578" width="43" height="30" rx="12" fill="white" /><text class="label" x="1510" y="2600" text-anchor="middle">否</text></g>
  <g id="start" text-anchor="middle">
    <rect class="terminal" x="920" y="35" width="160" height="60" rx="30" />
    <text class="node-text" x="1000" y="73">开始</text>
  </g>
  <g id="create" text-anchor="middle">
    <rect class="node" x="750" y="135" width="500" height="80" rx="16" />
    <text class="node-text" x="1000" y="183">创建 StreamClient</text>
  </g>
  <g id="handlers" text-anchor="middle">
    <rect class="node" x="750" y="245" width="500" height="80" rx="16" />
    <text class="node-text" x="1000" y="293">注册消息处理器</text>
  </g>
  <g id="launch" text-anchor="middle">
    <rect class="node" x="650" y="355" width="700" height="80" rx="16" />
    <text class="node-text" x="1000" y="403">通过 start() 在后台启动客户端</text>
  </g>
  <g id="register" text-anchor="middle">
    <rect class="node" x="750" y="505" width="500" height="90" rx="16" />
    <text class="node-text" x="1000" y="558">注册连接并获取新 ticket</text>
  </g>
  <g id="cancel-register" text-anchor="middle">
    <rect class="node" x="1350" y="500" width="500" height="100" rx="16" />
    <text class="node-text" x="1600" y="542.5">取消未完成的注册请求</text>
    <text class="small" x="1600" y="573.5">注册期间收到 stop() / close()</text>
  </g>
  <g id="registered" text-anchor="middle">
    <polygon class="decision" points="1000,645 1200,710 1000,775 800,710" />
    <text class="node-text" x="1000" y="718">注册成功？</text>
  </g>
  <g id="connect" text-anchor="middle">
    <rect class="node" x="770" y="825" width="460" height="90" rx="16" />
    <text class="node-text" x="1000" y="878">建立 WebSocket</text>
  </g>
  <g id="cancel-connect" text-anchor="middle">
    <rect class="node" x="1350" y="887.5" width="500" height="125" rx="16" />
    <text class="node-text" x="1600" y="927">取消未完成的握手</text>
    <text class="small" x="1600" y="958">握手期间收到 stop() / close()</text>
    <text class="small" x="1600" y="989">若连接已建立，则关闭该连接</text>
  </g>
  <g id="connected" text-anchor="middle">
    <polygon class="decision" points="1000,965 1200,1030 1000,1095 800,1030" />
    <text class="node-text" x="1000" y="1038">握手成功？</text>
  </g>
  <g id="receive" text-anchor="middle">
    <rect class="node" x="775" y="1145" width="450" height="90" rx="16" />
    <text class="node-text" x="1000" y="1198">接收消息（读取循环）</text>
  </g>
  <g id="runtime" text-anchor="middle">
    <polygon class="decision" points="1000,1270 1250,1340 1000,1410 750,1340" />
    <text class="node-text" x="1000" y="1348">运行期间发生什么？</text>
  </g>
  <g id="ping" text-anchor="middle">
    <rect class="node" x="135" y="1510" width="410" height="160" rx="16" />
    <text class="node-text" x="340" y="1582.5">在读取循环中回复 ping</text>
    <text class="node-text" x="340" y="1613.5">回传 opaque 数据</text>
  </g>
  <g id="business" text-anchor="middle">
    <rect class="node" x="565" y="1510" width="450" height="160" rx="16" />
    <text class="node-text" x="790" y="1551.5">创建并登记 SDK 分发任务</text>
    <text class="node-text" x="790" y="1582.5">读取循环继续接收</text>
    <text class="small" x="790" y="1613.5">任务中调用／等待 handler</text>
    <text class="small" x="790" y="1644.5">返回 Ack 后在原连接尝试发送</text>
  </g>
  <g id="disconnect" text-anchor="middle">
    <rect class="node" x="1025" y="1510" width="410" height="160" rx="16" />
    <text class="node-text" x="1230" y="1582.5">保留在途 SDK 分发任务</text>
    <text class="node-text" x="1230" y="1613.5">关闭旧连接，进入重连</text>
  </g>
  <g id="stop" text-anchor="middle">
    <rect class="node" x="1475" y="1510" width="410" height="160" rx="16" />
    <text class="node-text" x="1680" y="1582.5">请求停止接收新消息</text>
    <text class="node-text" x="1680" y="1613.5">进入统一清理流程</text>
  </g>
  <g id="backoff" text-anchor="middle">
    <rect class="node" x="220" y="1850" width="560" height="100" rx="16" />
    <text class="node-text" x="500" y="1892.5">共享指数退避（含随机抖动）</text>
    <text class="small" x="500" y="1923.5">注册失败、握手失败或连接中断</text>
  </g>
  <g id="backoff-stop" text-anchor="middle">
    <polygon class="decision" points="500,2010 700,2080 500,2150 300,2080" />
    <text class="small" x="500" y="2072.5">退避期间收到</text>
    <text class="small" x="500" y="2103.5">stop() / close()？</text>
  </g>
  <g id="cleanup" text-anchor="middle">
    <rect class="node" x="1150" y="2240" width="600" height="120" rx="16" />
    <text class="node-text" x="1450" y="2277">统一清理：停止接收新消息</text>
    <text class="small" x="1450" y="2308">等待全部在途 SDK 分发任务（含 ACK 发送）</text>
    <text class="small" x="1450" y="2339">包括重连前旧连接留下的分发任务</text>
  </g>
  <g id="drained" text-anchor="middle">
    <polygon class="decision" points="1450,2400 1720,2490 1450,2580 1180,2490" />
    <text class="small" x="1450" y="2467">SDK 分发任务是否在</text>
    <text class="small" x="1450" y="2498">shutdown_timeout 内完成？</text>
    <text class="small" x="1450" y="2529">默认 30 秒</text>
  </g>
  <g id="cancel" text-anchor="middle">
    <rect class="node" x="750" y="2630" width="500" height="100" rx="16" />
    <text class="node-text" x="1000" y="2657">请求取消剩余分发任务</text>
    <text class="small" x="1000" y="2688">短暂等待协作式取消</text>
    <text class="small" x="1000" y="2719">仍未结束则记录日志，继续释放资源</text>
  </g>
  <g id="resources" text-anchor="middle">
    <rect class="node" x="1150" y="2780" width="600" height="120" rx="16" />
    <text class="node-text" x="1450" y="2832.5">关闭 WebSocket（若仍存在）</text>
    <text class="node-text" x="1450" y="2863.5">关闭 SDK 创建的 HTTP 客户端</text>
  </g>
  <g id="end" text-anchor="middle">
    <rect class="terminal" x="1240" y="2965" width="420" height="70" rx="35" />
    <text class="node-text" x="1450" y="3008">客户端关闭完成</text>
  </g>
  <g id="ownership" text-anchor="middle">
    <rect class="note" x="150" y="2345" width="700" height="250" rx="16" />
    <text class="node-text" x="500" y="2385">应用后台业务：独立生命周期</text>
    <text class="small" x="500" y="2416">handler 自建任务不属于 SDK 分发任务集合。</text>
    <text class="small" x="500" y="2447">SDK 不等待或取消这些任务；由应用自行管理。</text>
    <text class="small" x="500" y="2478">示例在 client.close() 后退出 TaskGroup。</text>
    <text class="small" x="500" y="2509">正常退出时，TaskGroup 等待后台业务结束。</text>
    <text class="small" x="500" y="2540">业务资源应在后台业务结束后释放。</text>
    <text class="small" x="500" y="2571">异常或取消退出 TaskGroup 时会取消剩余任务。</text>
  </g>
  <text class="small" x="1450" y="3070" text-anchor="middle">shutdown_timeout 仅限制等待阶段；取消和资源释放另需时间。</text>
</svg>

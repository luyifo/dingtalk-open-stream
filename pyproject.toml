[project]
name = "dingtalk-open-stream"
version = "0.1.2"
description = "Async DingTalk Stream Mode client for Python 3.12"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "websockets>=13,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dingtalk_open_stream"]

[tool.uv]
package = true
